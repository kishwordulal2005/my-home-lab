{% extends "base.html" %}
{% block title %}Register - MyHomeLabExample.net{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Create Account</h2>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                {% if success %}
                <div class="alert alert-success">{{ success }}</div>
                {% endif %}

                <form method="POST" action="/register" id="regForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                               placeholder="0000000000" maxlength="100" autocomplete="off">
                        <div class="form-text">Must be exactly 10 digits.</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>

                <script>
                document.getElementById('regForm').addEventListener('submit', function(e) {
                    var phone = document.getElementById('phone').value.trim();
                    if (!/^\d{10}$/.test(phone)) {
                        e.preventDefault();
                        alert('Phone must be exactly 10 digits (0-9).');
                        return false;
                    }
                });
                </script>

                <div class="text-center mt-3">
                    <p class="text-muted">Already have an account? <a href="/login">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
